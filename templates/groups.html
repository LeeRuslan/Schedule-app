{% extends "base.html" %}
{% set active = 'groups' %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div>
            <h2>Группы</h2>
            <p class="page-subtitle">Учебные группы колледжа</p>
        </div>
        <button class="btn btn-primary" onclick="openGroupModal()">+ Добавить группу</button>
    </div>

    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Специальность</th>
                    <th>Курс</th>
                    <th style="width: 160px;">Действия</th>
                </tr>
            </thead>
            <tbody id="groups-tbody">
                <tr><td colspan="4" class="empty-row">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadGroups() {
    const tbody = document.getElementById('groups-tbody');
    try {
        const res = await fetch('/api/groups');
        const groups = await res.json();
        if (groups.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Нет групп. Добавьте первую.</td></tr>';
            return;
        }
        tbody.innerHTML = groups.map(g => `
            <tr>
                <td><b>${g.name}</b></td>
                <td>${g.speciality || '—'}</td>
                <td>${g.course || '—'}</td>
                <td>
                    <button class="btn-icon" onclick='openGroupModal(${JSON.stringify(g)})'>✏️</button>
                    <button class="btn-icon" onclick="deleteGroup(${g.id})">🗑</button>
                </td>
            </tr>
        `).join('');
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Ошибка загрузки</td></tr>';
    }
}

function openGroupModal(group = null) {
    const isEdit = group !== null;
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal">
            <h3>${isEdit ? 'Редактирование группы' : 'Новая группа'}</h3>
            <div class="modal-field">
                <label>Название группы</label>
                <input type="text" id="g-name" value="${isEdit ? group.name : ''}" placeholder="Например, П-21">
            </div>
            <div class="modal-field">
                <label>Специальность</label>
                <input type="text" id="g-spec" value="${isEdit ? (group.speciality || '') : ''}" placeholder="Программирование">
            </div>
            <div class="modal-field">
                <label>Курс</label>
                <input type="number" id="g-course" value="${isEdit ? (group.course || '') : ''}" min="1" max="5" placeholder="2">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
                <button class="btn btn-primary" onclick="saveGroup(${isEdit ? group.id : 'null'})">Сохранить</button>
            </div>
        </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    setTimeout(() => document.getElementById('g-name')?.focus(), 50);
}

async function saveGroup(id) {
    const name = document.getElementById('g-name').value.trim();
    if (!name) return alert('Введите название группы');
    const data = {
        name,
        speciality: document.getElementById('g-spec').value.trim() || null,
        course: parseInt(document.getElementById('g-course').value) || null
    };
    const url = id ? `/api/groups/${id}` : '/api/groups';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
        method, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    if (res.ok) {
        document.querySelector('.modal-overlay')?.remove();
        loadGroups();
    } else {
        alert('Ошибка сохранения');
    }
}

async function deleteGroup(id) {
    if (!confirm('Удалить группу? Все связанные занятия также будут затронуты.')) return;
    const res = await fetch(`/api/groups/${id}`, { method: 'DELETE' });
    if (res.ok) loadGroups();
    else alert('Не удалось удалить');
}

loadGroups();
</script>
{% endblock %}
